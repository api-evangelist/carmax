description: >-
  CarMax documents no rate limits. There is no public API, no developer documentation and
  therefore no published quota, window, burst allowance, response header (X-RateLimit-*,
  RateLimit-*, Retry-After) or exhaustion status code. Partner syndication traffic is
  governed by bilateral agreements that are not published.
notes: >-
  Rewritten 2026-09-05. The previous version was written by the 2026-05-04 bulk sweep with
  method "generated" and asserted a "Per-partner contract limit", a 429 throttle code and
  three policies (partner scoping, exponential backoff, inventory freshness) that CarMax
  has never published. Those were derived from nothing and have been removed. limit_count
  is now 0, which is the honest measurement.
