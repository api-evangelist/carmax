capabilities:
- name: search inventory
  description: Search CarMax's nationwide used-vehicle inventory in natural language
    ("an SUV with a third row under $25,000", "a small AWD car with good tech").
  source: press release
- name: explore listings
  description: Browse and open matching vehicle listings from within the conversation.
  source: press release
- name: vehicle valuation / instant offer
  description: Get CarMax's online offer for a car the customer wants to sell.
  source: press release
note_on_tool_schemas: >-
