name: CarMax in ChatGPT
status: shipped
summary: >-
  On 2026-02-27 CarMax became the first U.S. auto retailer with an app in the OpenAI
  ChatGPT App Store, putting its nationwide inventory of 45,000+ vehicles and its
  instant-offer tool inside the ChatGPT conversation. OpenAI's Apps SDK — the mechanism
  a ChatGPT app is built on — is itself built on the Model Context Protocol, so shipping
  a ChatGPT app means CarMax operates an MCP server that OpenAI's client connects to.
  CarMax has not published that endpoint, has not named MCP in any of its own material,
  and offers no way for a third-party agent to connect to it: the surface is reachable
  only from inside ChatGPT.
deployment:
  mode: remote
  endpoint: null
  install: null
  package: null
  auth: unknown
  verified: searched
  note: >-
    endpoint is deliberately null. CarMax publishes no MCP URL, and none of
    mcp.carmax.com, chatgpt.carmax.com, agent.carmax.com, apps.carmax.com,
    gateway.carmax.com or api.carmax.com resolves in DNS (all NXDOMAIN, probed
    2026-09-05). ai.carmax.com does resolve — an Azure App Service named
    "istaihubwebsite" — but every path there redirects to Microsoft Entra ID sign-in and
    a POST of tools/list to /mcp returned 401 with an empty body, so it is an internal
    employee hub, not this server. Writing a guessed URL here would assert a callable
    agent surface that does not exist.
distribution:
  channel: OpenAI ChatGPT App Store
  launched: '2026-02-27'
  publicly_callable: false
