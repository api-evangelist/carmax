description: CarMax does not publish a public developer portal or API pricing. The CarMax engineering
  team has documented internal API patterns (Data Access Layer, Business Logic Layer, Server-Driven UI,
  Backend for Frontend) on its engineering blog, but Store Locations API, Vehicle Inventory API, and
  related endpoints are consumed by CarMax's own web/mobile clients and partner-syndication agreements.
notes: No public API pricing exists. Partner / syndication integrations are negotiated case by case;
  no self-service developer pricing.
sources:
  - https://www.carmax.com/
  - https://www.carmax.com/engineering-blog
plans:
  - id: carmax-internal
    name: Internal / Partner Use
    type: enterprise
    description: APIs are used internally by CarMax web and mobile clients and exposed to selected partners
      and syndication channels under bilateral agreement.
    entries:
      - label: Partner agreement
        name: partner_agreement
        type: subscription
        metric: contract
        limit: -1
        timeFrame: year
        geo: US
        unit: 1
        price: contact partnerships
        userMultiplied: false
    elements:
      - name: CarMax Store Locations API
      - name: CarMax Vehicle Inventory API
      - name: CarMax Server-Driven UI API
      - name: Internal Data Access / BFF Layers
