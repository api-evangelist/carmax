description: >-
  CarMax publishes no API plans and no API pricing, because it publishes no public API.
  There is no developer portal, no sign-up, no self-service tier and no "contact sales"
  API page. Third-party access to CarMax inventory happens through bilateral syndication
  and marketplace agreements negotiated by CarMax's partnerships organisation, and those
  agreements are not published in any form we could read.
