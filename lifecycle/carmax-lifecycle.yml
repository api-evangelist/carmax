summary: >-
  CarMax publishes no API lifecycle material of any kind. There is no versioning policy,
  no deprecation policy, no Sunset/Deprecation header documentation, no SLA and no status
  page. That is consistent with the rest of the record: CarMax has no public API, so there
  is no external consumer to whom a lifecycle commitment would be owed. No Lifecycle,
  StatusPage or Deprecation pointer is wired into apis.yml, because wiring one would
  credit CarMax with a document it does not publish.
