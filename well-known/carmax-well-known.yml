note: >-
  Every carmax.com host sits behind an Akamai bot-manager policy that answers 403
  "Access Denied" to any non-browser client, including robots.txt and the homepage,
  so a live status code from those hosts says nothing about whether a document exists.
  CarMax DOES publish /.well-known/security.txt: the Internet Archive holds a real
  RFC 9116 document captured 2026-02-03 (archived status 200), saved verbatim here as
  carmax-security.txt. The media./investors. hosts run on the Q4 Inc investor-relations
  platform, which answers 200 with the body "Invalid key" for EVERY /.well-known/* path
  — a catch-all soft-200, not a document, and recorded as a miss.
